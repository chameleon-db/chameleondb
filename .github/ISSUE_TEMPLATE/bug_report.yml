name: Bug report
description: Something does not behave as documented
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security vulnerabilities must not be reported here** — use the private report link on the issue chooser.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `chameleon version`, or the commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, PostgreSQL version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal schema and commands. Remove secrets and real connection strings.
    validations:
      required: true
